name: Release to Maven Central

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven
          server-id: central
          server-username: MAVEN_USERNAME
          server-password: MAVEN_PASSWORD
          gpg-private-key: ${{ secrets.GPG_PRIVATE_KEY }}
          gpg-passphrase: MAVEN_GPG_PASSPHRASE

      - name: Build and Test
        run: mvn clean verify -B

      - name: Publish to Maven Central
        run: mvn deploy -P release -B -DskipTests
        env:
          # Central Portal user token (central.sonatype.com -> Account -> Generate User Token)
          MAVEN_USERNAME: ${{ secrets.CENTRAL_TOKEN_USERNAME }}
          MAVEN_PASSWORD: ${{ secrets.CENTRAL_TOKEN_PASSWORD }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}

      # The GitHub Release (tag, notes, assets) is created manually so it owns the
      # release record. Artifacts are distributed via Maven Central — not GitHub
      # Release assets — so this workflow does not attach jars. Uploading assets here
      # fails against an already-published (immutable) release.
