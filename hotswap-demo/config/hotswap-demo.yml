# ═══════════════════════════════════════════════════════════════════
# HotSwap Demo Configuration
# ═══════════════════════════════════════════════════════════════════
#
# Edit this file while the application is running.
# Changes are detected automatically — no restart needed!
#
# Try it:
#   1. Start the app:  mvn spring-boot:run
#   2. Open a browser: http://localhost:8080/config
#   3. Edit this file  (change a value below)
#   4. Refresh browser  → value updated instantly
# ═══════════════════════════════════════════════════════════════════

# ─── Feature Flags ───────────────────────────────────────────────
feature:
  new-checkout:
    enabled: false        # Try: change to true, then hit /checkout
  dark-mode:
    enabled: false        # Try: change to true, then hit /

# ─── Rate Limiting ───────────────────────────────────────────────
rate-limit:
  max-requests-per-minute: 100   # Try: change to 500

# ─── Application Settings ───────────────────────────────────────
app:
  welcome-message: "Welcome to HotSwap Demo!"   # Try: change this text
  discount-rate: 0.0                              # Try: change to 0.15

# ─── Sensitive Config (masked in logs) ───────────────────────────
secrets:
  api-key: "sk-demo-12345"   # This value is masked as *** in all logs
