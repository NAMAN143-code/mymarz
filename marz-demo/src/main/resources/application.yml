spring:
  application:
    name: marz-demo

server:
  port: 8080

# MARZ is enabled by default — no config needed.
# All @Marz fields will auto-register and start watching.
marz:
  enabled: true

# Demo: the naive baseline service re-reads this same file on every access.
demo:
  config-file: config/marz-demo.yml

# Expose actuator endpoints so MARZ health + metrics are visible.
management:
  endpoints:
    web:
      exposure:
        include: health, info, metrics
  endpoint:
    health:
      show-details: always

logging:
  level:
    com.mymarz: DEBUG
